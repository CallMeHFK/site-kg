[project]
name = "site-kg"
version = "0.1.0"
description = "Give a website URL or local directory, get a knowledge graph with an MCP interface for AI access"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "httpx[socks]>=0.28",
    "beautifulsoup4>=4.12",
    "html2text>=2025.4.15",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# JS-rendered sites: BFS deep crawl through the Crawl4AI wheel
crawl = ["crawl4ai>=0.7"]
# LLM-enriched semantic layer (entity/relation extraction) via cognee
semantic = ["cognee>=0.3"]

[project.scripts]
site-kg = "site_kg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["site_kg"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit select: ruff defaults drag in BLE/S, which flag deliberate patterns
# (e.g. broad except at the crawl boundary).
select = ["E", "F", "W", "I", "UP", "SIM", "ISC", "RUF", "G"]
