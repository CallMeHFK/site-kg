name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      # `python -m pytest`, not a bare `pytest`: a bare pytest can resolve
      # outside this environment and import a stale installed copy.
      - run: uv run python -m pytest -q
      - run: uv run ruff check .
