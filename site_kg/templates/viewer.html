<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
 :root{
  --space:#05070c;
  --ink:#f4f7fb;
  --muted:#9aa6b8;
  --line:#1b2130;
  --accent:#3b6cff;
  --bad:#ff7b72;
  --surface:#1c1c1c;
  --panel:#232323;
  --on-surface:#f1f1ef;
  --on-surface-muted:#b3b4ae;
  --display:"Liberation Sans Narrow","Nimbus Sans Narrow","Arial Narrow","Helvetica Neue",sans-serif;
  --text:"Nimbus Sans","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --margin:clamp(20px,4vw,64px);
  --bar:52px;
 }
 *{box-sizing:border-box}
 html,body{margin:0;padding:0}
 html{overscroll-behavior:none}
 body{background:var(--surface);color:var(--on-surface);
      font:16px/1.5 var(--text)}
 #sk-canvas{position:fixed;top:var(--bar);left:0;width:100vw;
      height:calc(100svh - var(--bar));display:block;z-index:0;outline:none}
 #sk-labels{position:fixed;top:var(--bar);left:0;width:100vw;
      height:calc(100svh - var(--bar));pointer-events:none;z-index:1}

 /* ---- live chrome (HUD) ---- */
 #hud{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--surface)}
 #bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
      min-height:52px;padding:7px 14px}
 #title{font-size:16px;font-weight:600;color:var(--on-surface);white-space:nowrap}
 #live-target{font-size:16px;color:var(--on-surface-muted);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;max-width:32ch;flex:0 1 auto}
 #readout{font-size:16px;font-weight:600;color:var(--on-surface);
      white-space:nowrap;font-variant-numeric:tabular-nums}
 #readout.calm{font-weight:400;color:var(--on-surface-muted)}
 #phase{font-size:15px;line-height:1;padding:5px 9px;background:var(--accent);
      color:#ffffff;white-space:nowrap}
 #phase.done{background:#2e2e2e;color:var(--on-surface-muted)}
 #cnt{font-size:15px;color:var(--on-surface-muted);white-space:nowrap;
      font-variant-numeric:tabular-nums;display:none}
 #cnt.on{display:inline}
 .t-scenes{display:flex;gap:6px;margin-left:auto}
 .mb{background:var(--panel);border:0;color:var(--on-surface-muted);
      padding:5px 10px;border-radius:0;cursor:pointer;font:inherit;font-size:15px;
      white-space:nowrap}
 .mb:hover{color:var(--on-surface);background:#2d2d2d}
 .mb.on{background:var(--accent);color:#ffffff}
 .swrap{position:relative;min-width:0;flex:0 1 220px}
 #q{background:var(--panel);border:0;color:var(--on-surface);padding:6px 10px;
    border-radius:0;width:100%;font:inherit;font-size:16px;min-width:0}
 #q::placeholder{color:var(--on-surface-muted)}
 #q:focus{outline:2px solid var(--accent);outline-offset:-1px}
 #sres{display:none;position:absolute;top:calc(100% + 6px);left:0;width:360px;
       max-width:80vw;max-height:320px;overflow-y:auto;background:var(--panel);
       z-index:40}
 #sres.open{display:block}
 .sr{padding:7px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;
     text-overflow:ellipsis;font-size:16px}
 .sr:hover,.sr[aria-selected="true"]{background:#2d2d2d}
 .sr .m{color:var(--on-surface-muted);font-size:14px;margin-left:8px}
 .panel{background:var(--panel);color:var(--on-surface)}
 #info{position:fixed;right:12px;top:calc(var(--bar) + 10px);max-width:340px;
       padding:10px 12px;display:none;z-index:6}
 #info.on{display:block}
 #info b{display:block;margin-bottom:2px}
 #info a{color:var(--on-surface)}
 #tip{position:fixed;display:none;pointer-events:none;background:var(--panel);
      color:var(--on-surface);padding:5px 8px;font-size:14px;z-index:30;
      max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #tip.on{display:block}
 #legend{position:fixed;left:12px;top:calc(var(--bar) + 10px);width:240px;
         max-height:60vh;overflow-y:auto;padding:10px 12px;display:none;z-index:6}
 #legend.on{display:block}
 #legend h4{margin:0 0 6px;font-size:15px;color:var(--on-surface);font-weight:600}
 #legend .keys{margin:12px 0 0;padding:10px 0 0;font-size:14px;
       color:var(--on-surface-muted);line-height:1.7}
 .ch{display:flex;align-items:center;gap:7px;padding:3px 5px;cursor:pointer;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
 .ch:hover{background:#2d2d2d}
 .ch.on{background:#2436ff4d}
 .ch .dot{width:8px;height:8px;border-radius:50%;flex:none}
 .ch .n{margin-left:auto;color:var(--on-surface-muted);font-size:14px;
        font-variant-numeric:tabular-nums}
 #fatal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
        max-width:640px;padding:16px 20px;display:none;z-index:50;color:#ff7b72}
 #fatal.on{display:block}

 /* ---- build overlay: what is being ingested right now ---- */
 #build{position:fixed;inset:var(--bar) 0 0 0;z-index:4;pointer-events:none}
 #build.hide{display:none}
 #build .b-panel{position:absolute;left:14px;top:14px;
      width:min(340px,calc(100vw - 28px));padding:13px 15px 12px;
      background:rgba(8,11,18,.9);color:#e6edf3;
      transition:opacity .45s ease}
 #build.out .b-panel{opacity:0}
 #build .b-phase{font-family:var(--display);font-weight:800;
      line-height:1;font-size:22px;color:#f4f7fb}
 #build.bad .b-phase{color:#ff7b72}
 #build .b-track{height:6px;background:#1b2130;margin:11px 0 9px;
      overflow:hidden}
 #build .b-fill{display:block;height:100%;width:100%;background:var(--accent);
      transform:scaleX(0);transform-origin:left;
      transition:transform .3s ease-out}
 #build.bad .b-fill{background:#ff7b72}
 #build.unknown .b-fill{width:38%;transform:translateX(-100%);
      animation:bscan 1.15s linear infinite}
 @keyframes bscan{from{transform:translateX(-100%)}to{transform:translateX(264%)}}
 #build .b-counts{font-size:14px;color:#b3b4ae;font-variant-numeric:tabular-nums}
 #build .b-recent{list-style:none;margin:10px 0 0;padding:0;font-size:13px;
      line-height:1.5;color:#c6cbd4}
 #build .b-recent li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #build .b-recent:empty{display:none}

 /* ---- launcher: a real render fills the frame, the address is the action ---- */
 #launcher{position:relative;z-index:20;background:var(--space);color:var(--ink);
           display:none;overscroll-behavior:contain}
 #launcher.on{display:block}
 #launcher.leave{animation:posterLeave .45s cubic-bezier(.4,0,.2,1) forwards}
 @keyframes posterLeave{to{opacity:0;transform:translateY(-3%)}}
 #launch-card{width:100%}

 .p-hero{position:relative;min-height:100svh;overflow:hidden;background:var(--space)}
 .p-hero-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
             object-position:62% center;
             animation:drift 30s cubic-bezier(.37,0,.63,1) infinite alternate}
 .p-hero-scrim{position:absolute;inset:0;background:rgba(5,7,12,.52)}
 .p-hero-in{position:relative;z-index:2;min-height:100svh;display:flex;
            flex-direction:column;padding:clamp(20px,3vw,40px) var(--margin)
            clamp(28px,5vw,56px)}
 .p-head{display:flex;align-items:center;gap:10px}
 .p-mark{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
 .p-wm{font-size:16px;font-weight:600;letter-spacing:.01em}
 .p-hero-body{margin:auto 0;width:100%;max-width:820px;padding:6vh 0}
 .p-title{margin:0;font-family:var(--display);font-weight:800;
          font-stretch:condensed;text-transform:uppercase;
          letter-spacing:-.022em;line-height:.86;
          font-size:clamp(48px,9.4vw,146px)}
 .p-title span{display:block;white-space:nowrap}
 .p-support{margin:26px 0 0;max-width:52ch;font-size:clamp(17px,1.35vw,21px);
            line-height:1.5;color:rgba(244,247,251,.76)}
 .p-form{display:flex;gap:12px;margin:34px 0 0;max-width:680px}
 .p-url{flex:1 1 auto;min-width:0;height:62px;padding:0 18px;border:0;
        border-radius:0;background:#0c121c;color:var(--ink);
        font:inherit;font-size:17px}
 .p-url::placeholder{color:#8d99ab}
 .p-url:focus{outline:2px solid var(--accent);outline-offset:2px;
              background:#101828}
 .p-go{flex:0 0 auto;height:62px;padding:0 26px;border:0;border-radius:0;
       background:var(--accent);color:#ffffff;font:inherit;font-size:17px;
       font-weight:600;cursor:pointer;white-space:nowrap;
       transition:background .18s ease-out,transform .18s ease-out}
 .p-go.off{background:#1a2233;color:#8e9bb0}
 .p-go.on:hover{background:#4d7bff}
 .p-go.on:active{transform:translateY(1px)}
 .p-go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
 .p-err{margin:10px 0 0;min-height:20px;font-size:15px;color:#ffb4ad}
 .p-err.ok{color:var(--muted)}
 .p-note{margin:18px 0 0;font-size:14.5px;color:rgba(244,247,251,.55)}

 /* ---- how it works: a spine of three steps, a real build capture ---- */
 .p-how{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
        gap:clamp(32px,6vw,96px);align-items:center;
        padding:clamp(56px,9vw,128px) var(--margin);background:#070b12}
 .p-step-list{list-style:none;margin:0;padding:0;position:relative}
 .p-step-list::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;
        width:2px;background:var(--line)}
 .p-step{position:relative;padding-left:clamp(34px,3.4vw,48px)}
 .p-step + .p-step{margin-top:clamp(32px,4vw,52px)}
 .p-step::before{content:"";position:absolute;left:0;top:.52em;width:12px;
        height:12px;border-radius:50%;background:var(--accent)}
 .p-step-title{display:block;font-family:var(--display);font-weight:800;
        font-stretch:condensed;text-transform:uppercase;letter-spacing:-.015em;
        line-height:.95;font-size:clamp(28px,3.2vw,48px)}
 .p-step-note{margin:10px 0 0;font-size:clamp(15px,1.2vw,17px);line-height:1.55;
        color:var(--muted);max-width:36ch}
 .p-how-shot{margin:0;overflow:hidden;background:#080b12}
 .p-how-shot img{display:block;width:100%;height:auto}
 @media (max-width:900px){
  .p-how{grid-template-columns:1fr;gap:36px}
  .p-hero-scrim{background:rgba(5,7,12,.66)}
 }

 /* ---- two worlds: image and text trade sides ---- */
 .p-worlds{padding:clamp(56px,9vw,128px) var(--margin);display:grid;
           gap:clamp(20px,3.2vw,44px);background:var(--space)}
 .world{display:grid;grid-template-columns:55% 45%;align-items:stretch;
        width:100%;min-height:clamp(340px,38vw,500px);padding:0;border:0;
        border-radius:0;background:#0a0e16;color:var(--ink);font:inherit;
        text-align:left;cursor:pointer;overflow:hidden;
        transition:background .3s ease-out,transform .2s ease-out}
 .world:nth-child(even){grid-template-columns:45% 55%}
 .world:nth-child(even) .world-art{order:2}
 .world:hover{background:#0e1420}
 .world:active{transform:scale(.995)}
 .world:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
 .world-art{display:block;overflow:hidden;background:#080b12}
 .world-art img{display:block;width:100%;height:100%;object-fit:cover;
                animation:drift 22s cubic-bezier(.37,0,.63,1) infinite alternate}
 .world-copy{display:flex;flex-direction:column;justify-content:center;
             gap:14px;padding:clamp(26px,4.5vw,64px)}
 .world-name{font-family:var(--display);font-weight:800;font-stretch:condensed;
             text-transform:uppercase;letter-spacing:-.02em;line-height:.88;
             font-size:clamp(34px,4.6vw,68px)}
 .world.on .world-name{color:var(--accent)}
 .world-desc{font-size:clamp(16px,1.3vw,19px);line-height:1.5;
             color:rgba(244,247,251,.72);max-width:32ch}
 .world-foot{display:flex;align-items:center;gap:10px;margin-top:8px;
             font-size:15px;color:rgba(244,247,251,.62)}
 .world-go{display:inline-flex;align-items:center;gap:9px;
           transition:transform .2s ease-out,color .2s ease-out}
 .world:hover .world-go{transform:translateX(5px);color:var(--ink)}
 .world-go svg{width:18px;height:18px}
 .world-now{display:none;color:var(--accent)}
 .world.on .world-go{display:none}
 .world.on .world-now{display:inline}
 @keyframes drift{from{transform:scale(1)}to{transform:scale(1.045)}}
 @media (max-width:820px){
  .world,.world:nth-child(even){grid-template-columns:1fr;min-height:0}
  .world:nth-child(even) .world-art{order:0}
  .world-art{aspect-ratio:16/10}
  .world-copy{padding:26px 22px 32px}
 }

 /* ---- closing lockup: the name, nothing to click ---- */
 .p-close{padding:clamp(80px,14vw,200px) var(--margin) clamp(48px,6vw,80px);
          background:var(--space);overflow:hidden}
 .p-close-word{margin:0;font-family:var(--display);font-weight:800;
               font-stretch:condensed;text-transform:uppercase;
               letter-spacing:-.03em;line-height:.8;
               font-size:clamp(72px,17vw,280px)}
 .p-close-dot{display:inline-block;width:.12em;height:.12em;border-radius:50%;
              background:var(--accent);margin-left:.05em}
 .p-close-line{margin:18px 0 0;font-size:16px;color:var(--muted)}

 @media (max-width:600px){
  .p-form{flex-direction:column}
  .p-go{width:100%}
  .p-hero-art{object-position:32% center}
  .p-support{margin-top:20px}
  .p-form{margin-top:28px}
 }

 /* ---- motion ---- */
 .sk-anim .reveal{opacity:0;transform:translateY(24px)}
 .sk-anim .reveal.in{opacity:1;transform:none;
       transition:opacity .5s ease-out,transform .5s cubic-bezier(.16,1,.3,1);
       transition-delay:var(--d,0ms)}
 @media (prefers-reduced-motion:reduce){
  .p-hero-art,.world-art img{animation:none}
  .sk-anim .reveal{opacity:1;transform:none;transition:none}
  #launcher.leave{animation:none}
  .world,.world-go,.p-go{transition:none}
  #build .b-panel,#build .b-fill{transition:none}
  #build.unknown .b-fill{animation:none;transform:none;width:100%}
 }
</style></head>
<body>
<canvas id="sk-canvas"></canvas>
<canvas id="sk-labels"></canvas>
<div id="hud"><div id="bar"></div></div>
<div id="build"></div>
<div id="legend" class="panel"></div>
<div id="info" class="panel"></div>
<div id="tip"></div>
<div id="launcher"><div id="launch-card"></div></div>
<div id="fatal" class="panel"></div>
<script type="application/json" id="sk-config">
{"title":__TITLE_JSON__,"stats":__STATS_JSON__,"docs":__DOCS_JSON__,"mode":"__MODE__","scene":"__SCENE__","runId":__RUN_ID_JSON__,"external":__EXTERNAL__,"liveUrl":__LIVE_URL_JSON__}
</script>
<script type="application/json" id="sk-launch-art">__LAUNCH_ART__</script>
<script type="application/json" id="sk-payload">__PAYLOAD__</script>
<script>
__BUNDLE__
</script>
<script>
if (window.SK && SK.boot) { SK.boot(); }
</script>
</body></html>
