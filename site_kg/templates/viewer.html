<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
 :root{
  --space:#04060b;
  --ink:#eef4ff;
  --muted:#8d9bb2;
  --line:rgba(140,180,255,.14);
  --accent:#58a6ff;
  --accent-2:#7ef9e0;
  --bad:#ff7b72;
  --surface:#04060b;
  --panel:rgba(11,17,29,.86);
  --on-surface:#eef4ff;
  --on-surface-muted:#93a1b7;
  --glass:linear-gradient(180deg,rgba(16,24,40,.86),rgba(7,11,20,.78));
  --display:"Liberation Sans Narrow","Nimbus Sans Narrow","Arial Narrow","Helvetica Neue",sans-serif;
  --text:"Nimbus Sans","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --margin:clamp(20px,4vw,64px);
  --bar:64px;
 }
 *{box-sizing:border-box}
 html,body{margin:0;padding:0}
 html{overscroll-behavior:none}
 body{background:var(--space);color:var(--on-surface);
      font:16px/1.5 var(--text);-webkit-font-smoothing:antialiased}
 #sk-canvas{position:fixed;top:var(--bar);left:0;width:100vw;
      height:calc(100svh - var(--bar));display:block;z-index:0;outline:none}
 #sk-labels{position:fixed;top:var(--bar);left:0;width:100vw;
      height:calc(100svh - var(--bar));pointer-events:none;z-index:1}

 /* ---- live chrome (HUD): a floating command deck over the graph ---- */
 #hud{position:fixed;top:0;left:0;right:0;z-index:5;padding:10px 14px;
      pointer-events:none}
 #bar{display:flex;flex-wrap:nowrap;align-items:center;gap:9px 16px;
      min-height:58px;padding:8px 12px;pointer-events:auto;
      background:var(--glass);border:1px solid var(--line);border-radius:15px;
      box-shadow:0 22px 60px rgba(0,0,0,.58),
                 inset 0 1px 0 rgba(255,255,255,.07);
      backdrop-filter:blur(18px) saturate(1.35);
      -webkit-backdrop-filter:blur(18px) saturate(1.35)}
 .hud-brand{display:flex;align-items:center;gap:11px;min-width:0;flex:0 1 auto}
 .hud-mark{position:relative;width:27px;height:27px;flex:none;border-radius:50%;
      background:radial-gradient(circle at 38% 32%,#c8f6ff 0%,#58a6ff 42%,#16233f 100%);
      box-shadow:0 0 0 1px rgba(150,210,255,.35),0 0 20px rgba(88,166,255,.5)}
 .hud-mark::after{content:"";position:absolute;inset:-5px;border-radius:50%;
      border:1px solid rgba(120,200,255,.4);animation:hudPulse 2.8s ease-out infinite}
 @keyframes hudPulse{0%{transform:scale(.7);opacity:.85}
   70%{transform:scale(1.4);opacity:0}100%{opacity:0}}
 .hud-id{display:flex;flex-direction:column;min-width:0;line-height:1.18}
 #title{font-family:var(--display);font-weight:800;font-size:17px;
      letter-spacing:.035em;text-transform:uppercase;color:var(--ink);
      white-space:nowrap}
 #live-target{font-size:12.5px;color:var(--muted);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;max-width:34ch;letter-spacing:.015em}
 .hud-live{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0;
      flex:0 1 auto}
 #phase{display:inline-flex;align-items:center;gap:7px;font-size:11px;
      letter-spacing:.1em;text-transform:uppercase;line-height:1;padding:8px 11px;
      border-radius:999px;color:#c6e8ff;white-space:nowrap;
      background:rgba(70,150,255,.14);border:1px solid rgba(90,170,255,.34);
      box-shadow:inset 0 0 18px rgba(60,140,255,.16)}
 #phase::before{content:"";width:6px;height:6px;border-radius:50%;flex:none;
      background:var(--accent-2);box-shadow:0 0 9px var(--accent-2);
      animation:hudBlink 1.5s ease-in-out infinite}
 #phase.done{color:var(--muted);background:rgba(255,255,255,.035);
      border-color:rgba(255,255,255,.09);box-shadow:none}
 #phase.done::before{background:#59c98a;box-shadow:0 0 8px #59c98a;animation:none}
 @keyframes hudBlink{0%,100%{opacity:1}50%{opacity:.3}}
 #readout{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;
      font-variant-numeric:tabular-nums;letter-spacing:.025em}
 #readout.calm{font-weight:500;color:var(--on-surface-muted)}
 #cnt{font-size:11.5px;color:#bfe6ff;white-space:nowrap;
      font-variant-numeric:tabular-nums;padding:5px 8px;border-radius:7px;
      background:rgba(88,166,255,.12);border:1px solid rgba(90,170,255,.25);
      display:none}
 #cnt.on{display:inline-block}
 .hud-tools{display:flex;align-items:center;gap:9px;margin-left:auto;
      min-width:0;flex-wrap:nowrap;flex:0 1 auto}
 .t-scenes{display:inline-flex;gap:3px;padding:3px;border-radius:11px;
      background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)}
 .mb{background:transparent;border:0;color:var(--on-surface-muted);
      padding:7px 11px;border-radius:8px;cursor:pointer;font:inherit;
      font-size:12.5px;letter-spacing:.035em;white-space:nowrap;flex:none;
      transition:color .16s ease,background .16s ease,box-shadow .16s ease}
 .mb:hover{color:var(--ink);background:rgba(255,255,255,.06)}
 .mb.on{background:linear-gradient(180deg,rgba(88,166,255,.34),rgba(88,166,255,.16));
      color:#f2f9ff;box-shadow:inset 0 0 0 1px rgba(120,190,255,.42),
      0 0 18px rgba(70,150,255,.24)}
 .swrap{position:relative;min-width:0;flex:0 1 218px}
 .swrap::before{content:"";position:absolute;left:11px;top:50%;width:10px;height:10px;
      margin-top:-6px;border:1.5px solid var(--muted);border-radius:50%;
      pointer-events:none;opacity:.8}
 .swrap::after{content:"";position:absolute;left:19px;top:calc(50% + 3px);
      width:5px;height:1.5px;border-radius:2px;background:var(--muted);
      transform:rotate(45deg);pointer-events:none;opacity:.8}
 #q{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
    color:var(--ink);padding:8px 11px 8px 30px;border-radius:9px;width:100%;
    font:inherit;font-size:13px;min-width:0;
    transition:border-color .16s ease,box-shadow .16s ease}
 #q::placeholder{color:var(--on-surface-muted)}
 #q:focus{outline:none;border-color:rgba(120,190,255,.55);
    box-shadow:0 0 0 3px rgba(88,166,255,.14)}
 #sres{display:none;position:absolute;top:calc(100% + 7px);left:0;width:360px;
       max-width:80vw;max-height:320px;overflow-y:auto;z-index:40;
       background:rgba(9,14,24,.97);border:1px solid var(--line);
       border-radius:11px;padding:5px;box-shadow:0 24px 60px rgba(0,0,0,.65);
       backdrop-filter:blur(16px)}
 #sres.open{display:block}
 .sr{padding:8px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;
     text-overflow:ellipsis;font-size:13.5px;border-radius:7px}
 .sr:hover,.sr[aria-selected="true"]{background:rgba(88,166,255,.14)}
 .sr .m{color:var(--on-surface-muted);font-size:12px;margin-left:8px}
 .panel{background:var(--panel);color:var(--on-surface);
        border:1px solid var(--line);border-radius:13px;
        box-shadow:0 20px 54px rgba(0,0,0,.55);
        backdrop-filter:blur(16px) saturate(1.2)}
 #info{position:fixed;right:14px;top:calc(var(--bar) + 12px);max-width:340px;
       padding:12px 14px;display:none;z-index:6;font-size:14px}
 #info.on{display:block}
 #info b{display:block;margin-bottom:3px;font-size:15px}
 #info a{color:#9fd0ff;text-decoration:none}
 #info a:hover{text-decoration:underline}
 #tip{position:fixed;display:none;pointer-events:none;z-index:30;
      background:rgba(8,13,22,.95);border:1px solid var(--line);
      border-radius:8px;color:var(--on-surface);padding:6px 9px;font-size:12.5px;
      max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      box-shadow:0 12px 34px rgba(0,0,0,.55)}
 #tip.on{display:block}
 #legend{position:fixed;left:14px;top:calc(var(--bar) + 12px);width:246px;
         max-height:60vh;overflow-y:auto;padding:13px 14px;display:none;z-index:6}
 #legend.on{display:block}
 #legend h4{margin:14px 0 7px;font-size:10.5px;color:var(--on-surface-muted);
      font-weight:600;letter-spacing:.12em;text-transform:uppercase}
 #legend h4:first-child{margin-top:0}
 #legend .muted{margin:0 0 10px}
 #legend .keys{margin:12px 0 0;padding:10px 0 0;display:grid;
       grid-template-columns:1fr 1fr;gap:7px 12px;
       border-top:1px solid rgba(255,255,255,.06)}
 #legend .kr{display:flex;align-items:center;gap:7px;min-width:0;
       font-size:12px;color:var(--on-surface-muted)}
 #legend .kb{flex:none;padding:2px 7px;border-radius:6px;font-size:11px;
       letter-spacing:.02em;color:var(--ink);
       background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);
       box-shadow:0 1px 0 rgba(255,255,255,.05)}
 #legend .ka{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .ch{display:flex;align-items:center;gap:8px;padding:5px 7px;cursor:pointer;
     border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
     font-size:13px}
 .ch:hover{background:rgba(255,255,255,.06)}
 .ch.on{background:rgba(88,166,255,.18)}
 .ch .dot{width:7px;height:7px;border-radius:50%;flex:none;
     box-shadow:0 0 8px currentColor}
 .ch .n{margin-left:auto;color:var(--on-surface-muted);font-size:12px;
        font-variant-numeric:tabular-nums}
 @media (max-width:760px){
  #hud{padding:8px}
  #bar{border-radius:12px;flex-wrap:wrap}
  .hud-live{order:3;width:100%}
  .hud-tools{margin-left:auto}
  .swrap{flex:1 1 150px}
  #live-target{max-width:26ch}
 }
 #fatal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
        max-width:640px;padding:16px 20px;display:none;z-index:50;color:#ff7b72}
 #fatal.on{display:block}

 /* ---- build overlay: what is being ingested right now ---- */
 #build{position:fixed;inset:var(--bar) 0 0 0;z-index:4;pointer-events:none}
 #build.hide{display:none}
 #build .b-panel{position:absolute;left:16px;top:16px;
      width:min(356px,calc(100vw - 32px));padding:16px 17px 14px;
      background:linear-gradient(180deg,rgba(14,22,38,.92),rgba(6,10,18,.86));
      border:1px solid var(--line);border-radius:16px;
      box-shadow:0 26px 72px rgba(0,0,0,.6),
                 inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter:blur(18px) saturate(1.3);
      -webkit-backdrop-filter:blur(18px) saturate(1.3);
      color:#e6edf3;transition:opacity .45s ease,transform .45s ease}
 /* The card arrives on the same beat the poster leaves, so the hand-off is a
    move, not a cut: one rises as the other falls. */
 #build.in .b-panel{animation:bCardIn .42s cubic-bezier(.16,1,.3,1)}
 @keyframes bCardIn{from{opacity:0;transform:translateY(10px) scale(.986)}}
 #build.out .b-panel{opacity:0;transform:translateY(-6px)}
 /* The legend owns the same corner while it is open; the build card steps
    aside instead of stacking behind it. */
 #build.legend-open .b-panel{opacity:0;transform:translateY(-6px)}
 #build .b-kicker{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
      color:#7fb6ff;margin-bottom:6px;display:flex;align-items:center;gap:7px}
 #build .b-kicker::after{content:"";flex:1;height:1px;
      background:linear-gradient(90deg,rgba(120,190,255,.35),transparent)}
 #build .b-phase{font-family:var(--display);font-weight:800;line-height:1.02;
      font-size:24px;letter-spacing:.01em;text-transform:uppercase;
      color:#f4f7fb}
 /* Each stage word lands on its own beat instead of swapping in place. */
 #build .b-phase.swap{animation:phaseIn .34s cubic-bezier(.16,1,.3,1)}
 @keyframes phaseIn{from{opacity:0;transform:translateY(6px)}}
 #build.bad .b-phase{color:#ff9d95}
 #build .b-track{height:4px;border-radius:99px;background:rgba(255,255,255,.07);
      margin:13px 0 10px;overflow:hidden}
 #build .b-fill{display:block;height:100%;width:100%;border-radius:99px;
      background:linear-gradient(90deg,#4ad8ff,#7ef9e0);
      box-shadow:0 0 14px rgba(90,220,255,.55);
      transform:scaleX(0);transform-origin:left;
      transition:transform .3s ease-out}
 #build.bad .b-fill{background:linear-gradient(90deg,#ff7b72,#ffb36b);
      box-shadow:0 0 14px rgba(255,123,114,.45)}
 #build.unknown .b-fill{width:38%;transform:translateX(-100%);
      animation:bscan 1.15s linear infinite}
 @keyframes bscan{from{transform:translateX(-100%)}to{transform:translateX(264%)}}
 #build .b-counts{font-size:12.5px;color:#a9b8cc;font-variant-numeric:tabular-nums;
      letter-spacing:.02em}
 #build .b-recent{list-style:none;margin:12px 0 0;padding:10px 0 0;
      border-top:1px solid rgba(255,255,255,.06);
      font-size:12px;line-height:1.55;color:#9fb0c6}
 #build .b-recent li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      padding-left:13px;position:relative}
 #build .b-recent li::before{content:"";position:absolute;left:0;top:.62em;
      width:4px;height:4px;border-radius:50%;background:#4ad8ff;
      box-shadow:0 0 7px rgba(74,216,255,.8)}
 /* The stream reads newest-first in emphasis: the page that just landed is
    the bright one, the older lines step back. */
 #build .b-recent li:not(:last-child){opacity:.5}
 #build .b-recent li:last-child{color:#d5e6ff;
      animation:bFeedIn .32s cubic-bezier(.16,1,.3,1)}
 @keyframes bFeedIn{from{opacity:0;transform:translateY(6px)}}
 #build .b-recent li:last-child::before{background:#9df3ff;
      box-shadow:0 0 10px rgba(157,243,255,.95)}
 #build .b-recent:empty{display:none}
 /* Complete: the bar closes out in green and the card stops asking to be
    watched, then leaves the frame on its own. */
 #build.done .b-fill{background:linear-gradient(90deg,#59c98a,#9df3c4);
      box-shadow:0 0 16px rgba(89,201,138,.6)}
 #build.done .b-phase{color:#c8f6dc}

 /* ---- intro film: three acts, one canvas, once per session ---- */
.promo{
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,monospace;
  --cyan:#5ee7ff;
}
html.promo-live{overflow:hidden}
html.promo-live #launcher{
  transform:scale(.994);opacity:.4;filter:blur(6px);
}
#launcher{transition:transform 1.05s cubic-bezier(.16,1,.3,1),opacity .9s ease,filter .9s ease}

.promo{
  position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  overflow:hidden;opacity:1;transition:opacity .68s ease;
  background:
    radial-gradient(820px 560px at 50% 40%,rgba(40,94,176,.20),transparent 66%),
    radial-gradient(560px 460px at 50% 88%,rgba(94,231,255,.07),transparent 72%),
    #04050a;
}
.promo.out{opacity:0;pointer-events:none}
.promo::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(118% 82% at 50% 42%,transparent 34%,rgba(0,0,0,.66) 100%);
}
#promo-canvas{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  transition:transform 1.05s cubic-bezier(.36,.02,.2,1),opacity .82s ease;
}
.promo.out #promo-canvas{transform:scale(1.9);opacity:0}
.promo-core{
  position:absolute;left:50%;top:36%;width:min(74vw,620px);aspect-ratio:1;
  transform:translate(-50%,-50%);z-index:1;pointer-events:none;
  background:radial-gradient(circle,rgba(94,231,255,.13),rgba(94,231,255,.04) 42%,transparent 68%);
  filter:blur(8px);opacity:0;transition:opacity 1.1s ease .2s;
}
.promo.ready .promo-core{opacity:1}

.promo-acts{
  position:absolute;left:0;right:0;top:69%;z-index:2;
  pointer-events:none;text-align:center;
  transition:opacity .38s ease;
}
.promo.in .promo-acts{opacity:0}
.act{
  position:absolute;left:0;right:0;top:0;
  display:flex;flex-direction:column;align-items:center;
  opacity:0;transform:translateY(16px) scale(.988);
  transition:opacity .26s ease,transform .44s cubic-bezier(.16,1,.3,1);
}
.act.on{opacity:1;transform:none}
.act-head{display:flex;align-items:center;gap:11px;
  font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase}
.act-head b{font-weight:400;color:#7e93ae}
.act-head i{font-style:normal;color:#7fe9ff}
.act-t{
  margin:11px 0 0;font-family:var(--display);font-weight:700;
  font-size:clamp(23px,3.1vw,36px);line-height:1;letter-spacing:-.005em;
  text-transform:uppercase;color:#eef6ff;
}

.promo-copy{
  position:absolute;left:0;right:0;top:62%;z-index:2;
  transform:translateY(-50%);padding:0 22px;text-align:center;
}
.promo-copy::before{
  content:"";position:absolute;left:50%;top:50%;z-index:-1;pointer-events:none;
  width:min(1000px,112vw);height:clamp(210px,32vh,320px);
  transform:translate(-50%,-50%);filter:blur(8px);
  background:radial-gradient(closest-side,rgba(4,5,10,.9),rgba(4,5,10,.55) 54%,transparent 78%);
}
.promo-word{
  margin:0;display:flex;align-items:baseline;justify-content:center;gap:.015em;
  font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(52px,10.5vw,128px);line-height:.9;letter-spacing:-.025em;color:#f4faff;
  text-shadow:0 0 52px rgba(94,231,255,.32);
}
.promo-word span,.promo-word em{
  display:inline-block;font-style:normal;
  opacity:0;transform:translateY(20px) scale(.97);filter:blur(11px);
  transition:opacity .78s ease,transform .95s cubic-bezier(.16,1,.3,1),filter .78s ease;
  transition-delay:calc(var(--i,0) * 62ms + .04s);
}
.promo-word em{
  width:.3em;height:.072em;border-radius:99px;align-self:center;margin-top:.02em;
  background:var(--cyan);color:transparent;overflow:hidden;
  box-shadow:0 0 34px rgba(94,231,255,.75);
}
.promo.in .promo-word span,.promo.in .promo-word em{opacity:1;transform:none;filter:none}
.promo-sub{
  margin:clamp(12px,1.8vw,20px) 0 0;font-family:var(--mono);
  font-size:clamp(9px,1vw,11px);letter-spacing:.4em;text-transform:uppercase;color:#93a9c6;
  opacity:0;transform:translateY(9px);
  transition:opacity .72s ease .85s,transform .72s ease .85s;
}
.promo.in .promo-sub{opacity:1;transform:none}

.promo-foot{
  position:absolute;left:0;right:0;bottom:clamp(24px,5.6vh,56px);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:13px;
  opacity:0;transition:opacity .7s ease .55s;
}
.promo.in .promo-foot{opacity:1}
.promo-bar{
  position:relative;width:min(242px,44vw);height:1px;
  background:rgba(140,190,255,.15);overflow:hidden;
}
.promo-bar i{
  position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,rgba(94,231,255,0),#5ee7ff 58%,#ffffff);
  box-shadow:0 0 13px rgba(94,231,255,.85);
  transition:width 1.2s linear .35s;
}
.promo.in .promo-bar i{width:100%}
.promo-meta{
  display:flex;align-items:center;justify-content:center;gap:11px;flex-wrap:wrap;
  font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5c6e86;
}
.promo-meta b{font-weight:400;color:#9db4d1}
.promo-meta s{text-decoration:none;color:#33415a}
.promo-skip{
  position:absolute;top:clamp(14px,2.6vh,26px);right:clamp(14px,2.6vw,28px);z-index:3;
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  padding:8px 14px;border-radius:999px;
  background:rgba(10,17,30,.46);border:1px solid rgba(140,190,255,.17);color:#93a8c3;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  opacity:0;backdrop-filter:blur(9px);
  transition:opacity .6s ease .1s,color .2s ease,border-color .2s ease,background .2s ease;
}
.promo.ready .promo-skip{opacity:1}
.promo-skip:hover{color:#effaff;border-color:rgba(94,231,255,.46);background:rgba(18,32,52,.72)}
.promo-skip i{font-style:normal;font-size:12px;line-height:1;opacity:.8}

@media (max-width:560px){
  .promo-copy{top:60%}
  .promo-acts{top:70%}
  .act-t{font-size:26px}
  .promo-core{top:30%;width:90vw}
  .promo-sub{letter-spacing:.3em}
  .promo-skip{top:12px;right:12px;padding:7px 11px;letter-spacing:.14em}
  .promo-meta{gap:8px;font-size:8.5px;letter-spacing:.14em}
}
@media (prefers-reduced-motion:reduce){
  .promo-word span,.promo-word em,.promo-sub,.promo-foot,.promo-skip,
  .promo-core,.act{transition:none}
  .promo-word span,.promo-word em{opacity:1;transform:none;filter:none}
  .promo-sub,.promo-foot,.promo-skip,.promo-core{opacity:1;transform:none}
  .promo-bar i{width:100%;transition:none}
  #launcher{transition:none}
}

/* ---- launcher: a real render fills the frame, the address is the action ---- */
 #launcher{position:relative;z-index:20;background:var(--space);color:var(--ink);
           display:none;overscroll-behavior:contain}
 #launcher.on{display:block}
 #launcher.leave{animation:posterLeave .45s cubic-bezier(.4,0,.2,1) forwards}
 @keyframes posterLeave{to{opacity:0;transform:translateY(-3%)}}
 #launch-card{width:100%}

 .p-hero{position:relative;min-height:100svh;overflow:hidden;background:var(--space)}
 .p-hero-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
             object-position:62% center;
             animation:drift 30s cubic-bezier(.37,0,.63,1) infinite alternate}
 .p-hero-scrim{position:absolute;inset:0;background:rgba(5,7,12,.52)}
 .p-hero-in{position:relative;z-index:2;min-height:100svh;display:flex;
            flex-direction:column;padding:clamp(20px,3vw,40px) var(--margin)
            clamp(28px,5vw,56px)}
 .p-head{display:flex;align-items:center;gap:10px}
 .p-mark{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
 .p-wm{font-size:16px;font-weight:600;letter-spacing:.01em}
 .p-hero-body{margin:auto 0;width:100%;max-width:820px;padding:6vh 0}
 .p-title{margin:0;font-family:var(--display);font-weight:800;
          font-stretch:condensed;text-transform:uppercase;
          letter-spacing:-.022em;line-height:.86;
          font-size:clamp(48px,9.4vw,146px)}
 .p-title span{display:block;white-space:nowrap}
 .p-support{margin:26px 0 0;max-width:52ch;font-size:clamp(17px,1.35vw,21px);
            line-height:1.5;color:rgba(244,247,251,.76)}
 .p-form{display:flex;gap:12px;margin:34px 0 0;max-width:680px}
 .p-url{flex:1 1 auto;min-width:0;height:62px;padding:0 18px;border:0;
        border-radius:0;background:#0c121c;color:var(--ink);
        font:inherit;font-size:17px}
 .p-url::placeholder{color:#8d99ab}
 .p-url:focus{outline:2px solid var(--accent);outline-offset:2px;
              background:#101828}
 .p-go{flex:0 0 auto;height:62px;padding:0 26px;border:0;border-radius:0;
       background:var(--accent);color:#ffffff;font:inherit;font-size:17px;
       font-weight:600;cursor:pointer;white-space:nowrap;
       transition:background .18s ease-out,transform .18s ease-out}
 .p-go.off{background:#1a2233;color:#8e9bb0}
 .p-go.on:hover{background:#4d7bff}
 .p-go.on:active{transform:translateY(1px)}
 .p-go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
 .p-err{margin:10px 0 0;min-height:20px;font-size:15px;color:#ffb4ad}
 .p-err.ok{color:var(--muted)}
 .p-note{margin:18px 0 0;font-size:14.5px;color:rgba(244,247,251,.55)}

 /* ---- how it works: a spine of three steps, a real build capture ---- */
 .p-how{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
        gap:clamp(32px,6vw,96px);align-items:center;
        padding:clamp(56px,9vw,128px) var(--margin);background:#070b12}
 .p-step-list{list-style:none;margin:0;padding:0;position:relative}
 .p-step-list::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;
        width:2px;background:var(--line)}
 .p-step{position:relative;padding-left:clamp(34px,3.4vw,48px)}
 .p-step + .p-step{margin-top:clamp(32px,4vw,52px)}
 .p-step::before{content:"";position:absolute;left:0;top:.52em;width:12px;
        height:12px;border-radius:50%;background:var(--accent)}
 .p-step-title{display:block;font-family:var(--display);font-weight:800;
        font-stretch:condensed;text-transform:uppercase;letter-spacing:-.015em;
        line-height:.95;font-size:clamp(28px,3.2vw,48px)}
 .p-step-note{margin:10px 0 0;font-size:clamp(15px,1.2vw,17px);line-height:1.55;
        color:var(--muted);max-width:36ch}
 .p-how-shot{margin:0;overflow:hidden;background:#080b12}
 .p-how-shot img{display:block;width:100%;height:auto}
 @media (max-width:900px){
  .p-how{grid-template-columns:1fr;gap:36px}
  .p-hero-scrim{background:rgba(5,7,12,.66)}
 }

 /* ---- two worlds: image and text trade sides ---- */
 .p-worlds{padding:clamp(56px,9vw,128px) var(--margin);display:grid;
           gap:clamp(20px,3.2vw,44px);background:var(--space)}
 .world{display:grid;grid-template-columns:55% 45%;align-items:stretch;
        width:100%;min-height:clamp(340px,38vw,500px);padding:0;border:0;
        border-radius:0;background:#0a0e16;color:var(--ink);font:inherit;
        text-align:left;cursor:pointer;overflow:hidden;
        transition:background .3s ease-out,transform .2s ease-out}
 .world:nth-child(even){grid-template-columns:45% 55%}
 .world:nth-child(even) .world-art{order:2}
 .world:hover{background:#0e1420}
 .world:active{transform:scale(.995)}
 .world:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
 .world-art{display:block;overflow:hidden;background:#080b12}
 .world-art img{display:block;width:100%;height:100%;object-fit:cover;
                animation:drift 22s cubic-bezier(.37,0,.63,1) infinite alternate}
 .world-copy{display:flex;flex-direction:column;justify-content:center;
             gap:14px;padding:clamp(26px,4.5vw,64px)}
 .world-name{font-family:var(--display);font-weight:800;font-stretch:condensed;
             text-transform:uppercase;letter-spacing:-.02em;line-height:.88;
             font-size:clamp(34px,4.6vw,68px)}
 .world.on .world-name{color:var(--accent)}
 .world-desc{font-size:clamp(16px,1.3vw,19px);line-height:1.5;
             color:rgba(244,247,251,.72);max-width:32ch}
 .world-foot{display:flex;align-items:center;gap:10px;margin-top:8px;
             font-size:15px;color:rgba(244,247,251,.62)}
 .world-go{display:inline-flex;align-items:center;gap:9px;
           transition:transform .2s ease-out,color .2s ease-out}
 .world:hover .world-go{transform:translateX(5px);color:var(--ink)}
 .world-go svg{width:18px;height:18px}
 .world-now{display:none;color:var(--accent)}
 .world.on .world-go{display:none}
 .world.on .world-now{display:inline}
 @keyframes drift{from{transform:scale(1)}to{transform:scale(1.045)}}
 @media (max-width:820px){
  .world,.world:nth-child(even){grid-template-columns:1fr;min-height:0}
  .world:nth-child(even) .world-art{order:0}
  .world-art{aspect-ratio:16/10}
  .world-copy{padding:26px 22px 32px}
 }

 /* ---- closing lockup: the name, nothing to click ---- */
 .p-close{padding:clamp(80px,14vw,200px) var(--margin) clamp(48px,6vw,80px);
          background:var(--space);overflow:hidden}
 .p-close-word{margin:0;font-family:var(--display);font-weight:800;
               font-stretch:condensed;text-transform:uppercase;
               letter-spacing:-.03em;line-height:.8;
               font-size:clamp(72px,17vw,280px)}
 .p-close-dot{display:inline-block;width:.12em;height:.12em;border-radius:50%;
              background:var(--accent);margin-left:.05em}
 .p-close-line{margin:18px 0 0;font-size:16px;color:var(--muted)}

 @media (max-width:600px){
  .p-form{flex-direction:column}
  .p-go{width:100%}
  .p-hero-art{object-position:32% center}
  .p-support{margin-top:20px}
  .p-form{margin-top:28px}
 }

 /* ---- motion ---- */
 .sk-anim .reveal{opacity:0;transform:translateY(24px)}
 .sk-anim .reveal.in{opacity:1;transform:none;
       transition:opacity .5s ease-out,transform .5s cubic-bezier(.16,1,.3,1);
       transition-delay:var(--d,0ms)}
 @media (prefers-reduced-motion:reduce){
  .p-hero-art,.world-art img{animation:none}
  .sk-anim .reveal{opacity:1;transform:none;transition:none}
  #launcher.leave{animation:none}
  .world,.world-go,.p-go{transition:none}
  #build .b-panel,#build .b-fill{transition:none}
  #build.unknown .b-fill{animation:none;transform:none;width:100%}
 }
</style></head>
